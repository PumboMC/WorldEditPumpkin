[package]
name = "worldedit-pumpkin"
description = "FastAsyncWorldEdit for Pumpkin: selection, edit and history commands compiled to a Wasm component"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# A Wasm component, which is what Pumpkin loads.
crate-type = ["cdylib"]

[dependencies]
pumpkin-plugin-api = "=0.2.1"
tracing.workspace = true
worldedit-core = { path = "../worldedit-core" }
